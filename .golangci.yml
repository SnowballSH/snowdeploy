version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
  exclusions:
    rules:
      # Test helpers close response bodies via t.Cleanup, which bodyclose
      # cannot follow, and hard-coded fixtures are not secrets.
      - path: _test\.go$
        linters:
          - gosec
          - bodyclose
      # A command-line tool that cannot write to its own stdout has nowhere to
      # report the failure; the exit code already carries the outcome.
      - path: ^cmd/
        linters:
          - errcheck
        source: fmt\.Fprint

formatters:
  enable:
    - gofmt
    - goimports
