name: canary-unhealthy

# Publishes the deploy-failure fixture image: a service that starts, binds, and
# then answers 500 forever. A deployment layer is only as trustworthy as its
# rollback path, and that path cannot be rehearsed against an image that works.
#
# Deliberately manual plus path-triggered: this image should change rarely, and
# a rebuild that quietly moved the digest would invalidate whatever a
# configuration repository had pinned for its drill.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cmd/canary-unhealthy/**"
      - "Containerfile.canary"
      - ".github/workflows/canary.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile.canary
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/snowdeploy-canary-unhealthy:latest
          provenance: false

      # The digest is what a drill pins, so print it where the run log keeps it.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          printf 'canary-unhealthy digest: %s\n' "${DIGEST}"
          printf 'canary-unhealthy digest: `%s`\n' "${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
